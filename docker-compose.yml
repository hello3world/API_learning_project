version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: mining_farm_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mining_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mining_password}
      POSTGRES_DB: ${POSTGRES_DB:-mining_farm}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mining_user} -d ${POSTGRES_DB:-mining_farm}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: mining_farm_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@admin.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports:
      - "5050:80"
    depends_on:
      - db
    restart: unless-stopped

volumes:
  pgdata:
